<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Game of Life</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            max-width: 300px;
        }
        #stats {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
        }
        button {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        input[type="range"] {
            width: 100%;
            margin: 5px 0;
        }
        .control-group {
            margin: 10px 0;
        }
        .control-group label {
            display: block;
            margin-bottom: 5px;
        }
        #status {
            margin-top: 10px;
            font-size: 12px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="controls">
            <h2>Game of Life 3D</h2>
            <div class="control-group">
                <label for="worldId">World ID:</label>
                <input type="text" id="worldId" value="world1" style="width: 100%;">
            </div>
            <div class="control-group">
                <label for="delay">Simulation Speed:</label>
                <input type="range" id="delay" min="50" max="1000" value="100">
                <span id="delayValue">100ms</span>
            </div>
            <div class="control-group">
                <button id="createBtn">Create World</button>
                <button id="startBtn">Start</button>
                <button id="stopBtn">Stop</button>
                <button id="randomBtn">Randomize</button>
                <button id="clearBtn">Clear</button>
            </div>
            <div id="status">Ready</div>
        </div>
        <div id="stats">
            <div>Generation: <span id="generation">0</span></div>
            <div>Alive Cells: <span id="aliveCells">0</span></div>
            <div>World Size: <span id="worldSize">0x0x0</span></div>
        </div>
    </div>

    <script>
        // Global variables
        let scene, camera, renderer, controls;
        let world = null;
        let animationId = null;
        let ws = null;
        let isSimulating = false;
        let worldId = 'world1';
        let delay = 100;

        // Initialize Three.js scene
        function init() {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            
            // Create camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 50);
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('container').appendChild(renderer.domElement);
            
            // Add lighting
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(1, 1, 1);
            scene.add(directionalLight);
            
            // Add orbit controls
            // Note: For this example, we'll use simple camera controls
            // In a real implementation, you would use OrbitControls
            
            // Handle window resize
            window.addEventListener('resize', onWindowResize, false);
            
            // Set up event listeners
            setupEventListeners();
            
            // Start animation loop
            animate();
        }

        function setupEventListeners() {
            document.getElementById('createBtn').addEventListener('click', createWorld);
            document.getElementById('startBtn').addEventListener('click', startSimulation);
            document.getElementById('stopBtn').addEventListener('click', stopSimulation);
            document.getElementById('randomBtn').addEventListener('click', randomizeWorld);
            document.getElementById('clearBtn').addEventListener('click', clearWorld);
            document.getElementById('delay').addEventListener('input', function() {
                delay = parseInt(this.value);
                document.getElementById('delayValue').textContent = delay + 'ms';
            });
            
            // Connect to WebSocket
            connectWebSocket();
        }

        function connectWebSocket() {
            const wsUrl = window.location.protocol.replace('http', 'ws') + '//' + window.location.host + '/game-of-life/ws/' + worldId;
            ws = new WebSocket(wsUrl);
            
            ws.onopen = function(event) {
                console.log('WebSocket connected');
                document.getElementById('status').textContent = 'Connected to server';
                updateButtonStates();
            };
            
            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    updateWorld(data);
                } catch (e) {
                    console.error('Error parsing message:', e);
                }
            };
            
            ws.onclose = function(event) {
                console.log('WebSocket closed');
                document.getElementById('status').textContent = 'Disconnected';
                updateButtonStates();
            };
            
            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
                document.getElementById('status').textContent = 'Connection error';
            };
        }

        function createWorld() {
            worldId = document.getElementById('worldId').value || 'world1';
            const url = `/game-of-life/world/${worldId}?width=30&height=30&depth=30`;
            
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                console.log('World created:', data);
                document.getElementById('status').textContent = 'World created';
                updateButtonStates();
                // Send a request to get the world data
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send('getWorldData');
                }
            })
            .catch(error => {
                console.error('Error creating world:', error);
                document.getElementById('status').textContent = 'Error creating world';
            });
        }

        function startSimulation() {
            const url = `/game-of-life/world/${worldId}/start?delay=${delay}`;
            
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    isSimulating = true;
                    document.getElementById('status').textContent = 'Simulation started';
                    updateButtonStates();
                }
            })
            .catch(error => {
                console.error('Error starting simulation:', error);
                document.getElementById('status').textContent = 'Error starting simulation';
            });
        }

        function stopSimulation() {
            const url = `/game-of-life/world/${worldId}/stop`;
            
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    isSimulating = false;
                    document.getElementById('status').textContent = 'Simulation stopped';
                    updateButtonStates();
                }
            })
            .catch(error => {
                console.error('Error stopping simulation:', error);
                document.getElementById('status').textContent = 'Error stopping simulation';
            });
        }

        function randomizeWorld() {
            const url = `/game-of-life/world/${worldId}/randomize?density=30`;
            
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    document.getElementById('status').textContent = 'World randomized';
                }
            })
            .catch(error => {
                console.error('Error randomizing world:', error);
                document.getElementById('status').textContent = 'Error randomizing world';
            });
        }

        function clearWorld() {
            const url = `/game-of-life/world/${worldId}/clear`;
            
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    document.getElementById('status').textContent = 'World cleared';
                    // Clear the scene
                    clearScene();
                }
            })
            .catch(error => {
                console.error('Error clearing world:', error);
                document.getElementById('status').textContent = 'Error clearing world';
            });
        }

        function updateWorld(data) {
            // Update stats
            document.getElementById('generation').textContent = data.generation;
            document.getElementById('aliveCells').textContent = data.aliveCells;
            document.getElementById('worldSize').textContent = `${data.width}x${data.height}x${data.depth}`;
            
            // Update scene with new data
            if (data.cells && data.cells.length > 0) {
                updateSceneWithCells(data.cells);
            }
        }

        function updateSceneWithCells(cells) {
            // Clear existing cells
            clearScene();
            
            // Create new cells
            const geometry = new THREE.SphereGeometry(0.5, 8, 8);
            const material = new THREE.MeshPhongMaterial({ 
                color: 0x00ff00,
                emissive: 0x004400,
                shininess: 30
            });
            
            cells.forEach(cell => {
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(cell.x - 15, cell.y - 15, cell.z - 15);
                scene.add(mesh);
            });
        }

        function clearScene() {
            // Remove all meshes from scene
            while(scene.children.length > 0) { 
                scene.remove(scene.children[0]); 
            }
            
            // Add back lighting
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(1, 1, 1);
            scene.add(directionalLight);
        }

        function updateButtonStates() {
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const createBtn = document.getElementById('createBtn');
            
            startBtn.disabled = isSimulating;
            stopBtn.disabled = !isSimulating;
            createBtn.disabled = ws && ws.readyState === WebSocket.OPEN;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            animationId = requestAnimationFrame(animate);
            
            // Simple rotation for visual effect
            if (scene.children.length > 2) { // Skip lights
                scene.rotation.x += 0.001;
                scene.rotation.y += 0.001;
            }
            
            renderer.render(scene, camera);
        }

        // Initialize the application
        window.onload = function() {
            init();
        };
    </script>
</body>
</html>
