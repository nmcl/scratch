<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Game of Life</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            max-width: 300px;
        }
        #stats {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
        }
        button {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            margin-bottom: 5px;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        input[type="range"] {
            width: 100%;
            margin: 5px 0;
        }
        .control-group {
            margin: 10px 0;
        }
        .control-group label {
            display: block;
            margin-bottom: 5px;
        }
        #status {
            margin-top: 10px;
            font-size: 12px;
            color: #ccc;
        }
        h1 {
            color: #4CAF50;
            text-align: center;
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="controls">
            <h1>3D Game of Life</h1>
            <div class="control-group">
                <label for="worldId">World ID:</label>
                <input type="text" id="worldId" value="world1" style="width: 100%;">
            </div>
            <div class="control-group">
                <label for="delay">Simulation Speed:</label>
                <input type="range" id="delay" min="50" max="1000" value="100">
                <span id="delayValue">100ms</span>
            </div>
            <div class="control-group">
                <button id="createBtn">Create World</button>
                <button id="startBtn">Start</button>
                <button id="stopBtn">Stop</button>
                <button id="randomBtn">Randomize</button>
                <button id="clearBtn">Clear</button>
            </div>
            <div id="status">Ready</div>
        </div>
        <div id="stats">
            <div>Generation: <span id="generation">0</span></div>
            <div>Alive Cells: <span id="aliveCells">0</span></div>
            <div>World Size: <span id="worldSize">0x0x0</span></div>
        </div>
    </div>

    <script>
        // Global variables
        let isSimulating = false;
        let worldId = 'world1';
        let delay = 100;

        function setupEventListeners() {
            document.getElementById('createBtn').addEventListener('click', createWorld);
            document.getElementById('startBtn').addEventListener('click', startSimulation);
            document.getElementById('stopBtn').addEventListener('click', stopSimulation);
            document.getElementById('randomBtn').addEventListener('click', randomizeWorld);
            document.getElementById('clearBtn').addEventListener('click', clearWorld);
            document.getElementById('delay').addEventListener('input', function() {
                delay = parseInt(this.value);
                document.getElementById('delayValue').textContent = delay + 'ms';
            });
            
            // Initial status update
            updateStatus('Ready');
        }

        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }

        function createWorld() {
            worldId = document.getElementById('worldId').value || 'world1';
            const url = `/game-of-life/world/${worldId}?width=30&height=30&depth=30`;
            
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                console.log('World created:', data);
                updateStatus('World created');
                updateButtonStates();
            })
            .catch(error => {
                console.error('Error creating world:', error);
                updateStatus('Error creating world');
            });
        }

        function startSimulation() {
            const url = `/game-of-life/world/${worldId}/start?delay=${delay}`;
            
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    isSimulating = true;
                    updateStatus('Simulation started');
                    updateButtonStates();
                }
            })
            .catch(error => {
                console.error('Error starting simulation:', error);
                updateStatus('Error starting simulation');
            });
        }

        function stopSimulation() {
            const url = `/game-of-life/world/${worldId}/stop`;
            
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    isSimulating = false;
                    updateStatus('Simulation stopped');
                    updateButtonStates();
                }
            })
            .catch(error => {
                console.error('Error stopping simulation:', error);
                updateStatus('Error stopping simulation');
            });
        }

        function randomizeWorld() {
            const url = `/game-of-life/world/${worldId}/randomize?density=30`;
            
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    updateStatus('World randomized');
                }
            })
            .catch(error => {
                console.error('Error randomizing world:', error);
                updateStatus('Error randomizing world');
            });
        }

        function clearWorld() {
            const url = `/game-of-life/world/${worldId}/clear`;
            
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    updateStatus('World cleared');
                }
            })
            .catch(error => {
                console.error('Error clearing world:', error);
                updateStatus('Error clearing world');
            });
        }

        function updateButtonStates() {
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            
            startBtn.disabled = isSimulating;
            stopBtn.disabled = !isSimulating;
        }

        // Initialize when page loads
        window.onload = function() {
            setupEventListeners();
            updateStatus('Ready - Click Create World to start');
        };
    </script>
</body>
</html>
