# Server configuration
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Logging
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{3.}] (%t) %s%e%n

# OpenAPI
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.ui.path=/swagger-ui

# Database (optional - for persistence)
# quarkus.datasource.db-kind=postgresql
# quarkus.datasource.username=gameuser
# quarkus.datasource.password=gamepass
# quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/gameoflife
